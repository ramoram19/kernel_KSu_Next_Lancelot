name: Build Kernel
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Kernel by ${{ github.actor }}
    runs-on: ubuntu-22.04
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"
    steps:
    - uses: actions/checkout@v4
    - name: Prepare Environment
      run: |
        grep -v -E "^#|^\n" config.env | sed 's/ #.*//; s/#.*//' >> $GITHUB_ENV

    - name: Remove unused packages
      if: env.REMOVE_UNUSED_PACKAGES == 'true'
      uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: true
        android: false
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true
        swap-storage: false

    - name: Set swap to 6G
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 6

    - name: Setup kernel build environment
      run: |
        echo "BUILD_TIME=$(TZ=UTC date "+%Y%m%d%H%M")" >> $GITHUB_ENV
        echo "DEVICE=$(echo ${{ env.KERNEL_CONFIG }} | sed 's!vendor/!!;s/_defconfig//;s/_user//;s/-perf//')" >> $GITHUB_ENV
        sudo apt-get update
        sudo apt-get install git ccache automake flex lzop bison gperf build-essential zip curl zlib1g-dev g++-multilib libxml2-utils bzip2 libbz2-dev libbz2-1.0 libghc-bzlib-dev squashfs-tools pngcrush schedtool dpkg-dev liblz4-tool make optipng maven libssl-dev pwgen libswitch-perl policycoreutils minicom libxml-sax-base-perl libxml-simple-perl bc libc6-dev-i386 lib32ncurses5-dev libx11-dev lib32z-dev libgl1-mesa-dev xsltproc unzip device-tree-compiler python2 python3 binutils-aarch64-linux-gnu
        sudo apt-get install -y gcc-arm-linux-gnueabi gcc-aarch64-linux-gnu || echo "[!] apt cross-gcc install had issues"
        arm-linux-gnueabi-gcc --version | head -1
        aarch64-linux-gnu-gcc --version | head -1
        mkdir -p $GITHUB_WORKSPACE/kernel_workspace

    - name: Download AOSP Clang
      if: env.USE_CUSTOM_CLANG != 'true' && env.USE_CUSTOM_GCC != 'true' && env.ENABLE_GCC_AOSP != 'true'
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        mkdir clang
        wget -nv https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/${{ env.CLANG_BRANCH }}/clang-${{ env.CLANG_VERSION }}.tar.gz
        tar -C clang/ -zxvf clang-${{ env.CLANG_VERSION }}.tar.gz

    - name: Download Custom Clang
      if: env.USE_CUSTOM_CLANG == 'true' && env.ENABLE_GCC_AOSP != 'true'
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        if [[ ${{ env.CUSTOM_CLANG_SOURCE }} == *'.tar.gz' ]]; then
            wget -nv -O clang.tar.gz ${{ env.CUSTOM_CLANG_SOURCE }}
            mkdir clang
            tar -C clang/ -zxvf clang.tar.gz
        elif [[ ${{ env.CUSTOM_CLANG_SOURCE }} == *'.tar.xz' ]]; then
            wget -nv -O clang.tar.xz ${{ env.CUSTOM_CLANG_SOURCE }}
            mkdir clang
            tar -C clang/ -Jxvf clang.tar.xz
        elif [[ ${{ env.CUSTOM_CLANG_SOURCE }} == *'.git' ]]; then
            git clone ${{ env.CUSTOM_CLANG_SOURCE }} -b ${{ env.CUSTOM_CLANG_BRANCH }} clang --depth=1
        else
            wget -nv -O clang.zip ${{ env.CUSTOM_CLANG_SOURCE }}
            mkdir clang
            unzip clang.zip -d clang/
        fi
        if [[ "$(find ./clang -mindepth 1 -maxdepth 1 -type d | wc -l)" == "1" ]]; then
            mv -f "$(find ./clang -mindepth 1 -maxdepth 1 -type d)"/* ./clang
        fi

    - name: Download GCC AOSP
      if: env.ENABLE_GCC_AOSP == 'true' && env.USE_CUSTOM_GCC != 'true' && env.USE_CUSTOM_CLANG != 'true'
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        if [ ${{ env.ENABLE_GCC_ARM64 }} = true ]; then
            mkdir gcc-64
            wget -nv -O gcc-aarch64.tar.gz https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/+archive/refs/tags/android-12.1.0_r27.tar.gz
            tar -C gcc-64/ -zxvf gcc-aarch64.tar.gz
            echo "GCC_64=CROSS_COMPILE=$GITHUB_WORKSPACE/kernel_workspace/gcc-64/bin/aarch64-linux-android-" >> $GITHUB_ENV
        fi

        if [ ${{ env.ENABLE_GCC_ARM32 }} = true ]; then
            mkdir gcc-32
            wget -nv -O gcc-arm.tar.gz https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9/+archive/refs/tags/android-12.1.0_r27.tar.gz
            tar -C gcc-32/ -zxvf gcc-arm.tar.gz
            echo "GCC_32=CROSS_COMPILE_ARM32=$GITHUB_WORKSPACE/kernel_workspace/gcc-32/bin/arm-linux-androideabi-" >> $GITHUB_ENV
        fi

    - name: Download Custom GCC
      if: env.USE_CUSTOM_GCC == 'true' && env.ENABLE_GCC_AOSP != 'true'
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        if [ ${{ env.USE_CUSTOM_GCC_64 }} = true ]; then
            if [[ ${{ env.CUSTOM_GCC_64_SOURCE }} == *'.tar.gz' ]]; then
                wget -nv -O gcc-64.tar.gz ${{ env.CUSTOM_GCC_64_SOURCE }}
                mkdir gcc-64
                tar -C gcc-64/ -zxvf gcc-64.tar.gz
            elif [[ ${{ env.CUSTOM_GCC_64_SOURCE }} == *'.tar.xz' ]]; then
                wget -nv -O gcc-64.xz ${{ env.CUSTOM_GCC_64_SOURCE }}
                mkdir gcc-64
                tar -C gcc-64/ -Jxvf gcc-64.xz
            elif [[ ${{ env.CUSTOM_GCC_64_SOURCE }} == *'.git' ]]; then
                git clone ${{ env.CUSTOM_GCC_64_SOURCE }} -b ${{ env.CUSTOM_GCC_64_BRANCH }} gcc-64 --depth=1
            else
                wget -nv -O gcc-64.zip ${{ env.CUSTOM_GCC_64_SOURCE }}
                mkdir gcc-64
                unzip gcc-64.zip -d gcc-64/
            fi
            if [[ "$(find ./gcc-64 -mindepth 1 -maxdepth 1 -type d | wc -l)" == "1" ]]; then
                mv -f "$(find ./gcc-64 -mindepth 1 -maxdepth 1 -type d)"/* ./gcc-64
            fi
        fi
        if [ ${{ env.USE_CUSTOM_GCC_32 }} = true ]; then
            if [[ ${{ env.CUSTOM_GCC_32_SOURCE }} == *'.tar.gz' ]]; then
                wget -nv -O gcc-32.tar.gz ${{ env.CUSTOM_GCC_32_SOURCE }}
                mkdir gcc-32
                tar -C gcc-32/ -zxvf gcc-32.tar.gz
            elif [[ ${{ env.CUSTOM_GCC_32_SOURCE }} == *'.tar.xz' ]]; then
                wget -nv -O gcc-32.xz ${{ env.CUSTOM_GCC_32_SOURCE }}
                mkdir gcc-32
                tar -C gcc-32/ -Jxvf gcc-32.xz
            elif [[ ${{ env.CUSTOM_GCC_32_SOURCE }} == *'.git' ]]; then
                git clone ${{ env.CUSTOM_GCC_32_SOURCE }} -b ${{ env.CUSTOM_GCC_32_BRANCH }} gcc-32 --depth=1
            else
                wget -nv -O gcc-32.zip ${{ env.CUSTOM_GCC_32_SOURCE }}
                mkdir gcc-32
                unzip gcc-32.zip -d gcc-32/
            fi
            if [[ "$(find ./gcc-32 -mindepth 1 -maxdepth 1 -type d | wc -l)" == "1" ]]; then
                mv -f "$(find ./gcc-32 -mindepth 1 -maxdepth 1 -type d)"/* ./gcc-32
            fi
        fi

    - name: Download mkbootimg tools
      if: env.BUILD_BOOT_IMG == 'true'
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        git clone https://android.googlesource.com/platform/system/tools/mkbootimg tools -b master-kernel-build-2022 --depth=1

    - name: Download kernel source
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        git clone --recursive ${{ env.KERNEL_SOURCE }} -b ${{ env.KERNEL_SOURCE_BRANCH }} android-kernel --depth=1
        if [[ ${{ env.ADD_LOCALVERSION_TO_FILENAME }} == 'true' ]]; then
          echo "LOCALVERSION=$(cat android-kernel/localversion)" >> $GITHUB_ENV
        else
          echo "LOCALVERSION=" >> $GITHUB_ENV
        fi

    - name: Patch upstream build errors
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
        I2C_FILE=drivers/i2c/busses/i2c-mtk.c
        if grep -q 'if ((id == 1) || (id == 6) || (id == 8))' $I2C_FILE; then
          sed -i 's/if ((id == 1) || (id == 6) || (id == 8))/if ((i2c->id == 1) || (i2c->id == 6) || (i2c->id == 8))/' $I2C_FILE
          echo "[+] fixed undeclared identifier 'id' in i2c-mtk.c"
        elif grep -q 'if ((i2c->id == 1) || (i2c->id == 6) || (i2c->id == 8))' $I2C_FILE; then
          echo "[=] i2c-mtk.c already fixed upstream"
        else
          echo "[!] i2c-mtk.c does not match the expected pattern, check it"
        fi

    - name: Download source boot image
      if: env.BUILD_BOOT_IMG == 'true'
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        wget -nv -O boot-source.img ${{ env.SOURCE_BOOT_IMAGE }}
        if [ -f boot-source.img ]; then
            echo "FORMAT_MKBOOTING=$(echo `tools/unpack_bootimg.py --boot_img=boot-source.img --format mkbootimg`)" >> $GITHUB_ENV
            echo "HAVE_SOURCE_BOOT_IMAGE=true" >> $GITHUB_ENV
        fi

    - name: Setup KernelSU
      if: env.ENABLE_KERNELSU == 'true'
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
        curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s ${{ env.SUKISU_VERSION }}
        if [ -d KernelSU ]; then
            KSU_VERSION="_SukiSU-$(cd KernelSU && /usr/bin/git describe --tags --abbrev=0)"
        else
            KSU_VERSION=""
        fi
        echo "UPLOADNAME=$KSU_VERSION" >> $GITHUB_ENV
        if [ ${{ env.KSU_REVERT }} = true ]; then
            git apply $GITHUB_WORKSPACE/patches/KSU_REVERT.patch
        fi
        
    - name: Patch SukiSU for 4.14
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
        python3 - <<'PYEOF'
        import re, sys, os, pathlib
        base = pathlib.Path("KernelSU/kernel")
        ksrc = pathlib.Path(os.environ["GITHUB_WORKSPACE"]) / "kernel_workspace/android-kernel"
        kl = ksrc / "include/linux"

        def head(txt):
            return txt.read_text(errors="replace")

        # 1. access_ok. arm64 gained the _addr_save variant in 4.19 and the
        #    two-argument form was removed, but this tree still uses it.
        kpm = base / "kpm/kpm.c"
        if not kpm.is_file():
            sys.exit("[!] %s not found" % kpm)
        t = head(kpm)
        A1 = r"([^,()]+)"
        A2 = r"((?:[^()]|\([^()]*\))*)"
        n = len(re.findall(r"access_ok\(" + A1 + r",", t))
        t = re.sub(r"access_ok\(" + A1 + r", *" + A2 + r"\)",
                   r"access_ok(VERIFY_READ, \1, \2)", t)
        kpm.write_text(t)
        done = t.count("access_ok(VERIFY_READ")
        print("[+] access_ok: %d call sites, %d now VERIFY_READ" % (n, done))
        if n and done != n:
            sys.exit("[!] access_ok patch incomplete")

        # 2. task_struct pid member. Both 4.14 trees here report 4.14 but
        #    carry different layouts, so read the fetched header.
        sup = base / "kpm/super_access.c"
        if sup.is_file():
            sched = kl / "sched.h"
            if not sched.is_file():
                sys.exit("[!] %s not found" % sched)
            st = head(sched)
            if re.search(r"struct\s+pid\s*\*\s*thread_pid\s*;", st):
                pidm = "thread_pid"
            elif re.search(r"struct\s+pid_link\s+pids\s*\[", st):
                pidm = "pids[PIDTYPE_PID].pid"
            else:
                sys.exit("[!] cannot determine task_struct pid member")
            t = head(sup)
            # Tolerate whitespace differences between SukiSU releases.
            pat = (r"#if\s+LINUX_VERSION_CODE\s*<\s*KERNEL_VERSION\(\s*4\s*,\s*19\s*,"
                   r"\s*0\s*\)\s*\n\s*DEFINE_MEMBER\(task_struct,\s*"
                   r"pids\[PIDTYPE_PID\]\.pid\)\s*\n\s*#else\s*\n\s*"
                   r"DEFINE_MEMBER\(task_struct,\s*thread_pid\)\s*\n\s*#endif")
            t2, cnt = re.subn(pat, "DEFINE_MEMBER(task_struct, %s)" % pidm, t)
            if cnt:
                sup.write_text(t2)
                print("[+] super_access: task_struct pid member -> %s" % pidm)
            else:
                print("[=] super_access: no version-guarded pid block, left alone")

        # 3. strncpy_from_user_nofault arrived after 4.14; the function is
        #    strncpy_from_unsafe_user there, same signature.
        ua = kl / "uaccess.h"
        if not ua.is_file():
            sys.exit("[!] %s not found" % ua)
        if "strncpy_from_user_nofault" not in head(ua):
            if "strncpy_from_unsafe_user" not in head(ua):
                sys.exit("[!] no strncpy_from_user in uaccess.h")
            hits = 0
            for p in list(base.rglob("*.c")) + list(base.rglob("*.h")):
                t = head(p)
                if "strncpy_from_user_nofault" in t:
                    p.write_text(t.replace("strncpy_from_user_nofault",
                                           "strncpy_from_unsafe_user"))
                    hits += 1
            print("[+] strncpy_from_user_nofault -> unsafe in %d files" % hits)
            if hits == 0:
                sys.exit("[!] nothing renamed but kernel lacks the nofault spelling")

        # 4. ksys_close() (5.9) and close_fd() (5.11) do not exist in 4.14.
        #    __close_fd() is the primitive both wrap.
        sc = kl / "syscalls.h"
        have_close = sc.is_file() and "ksys_close" in head(sc)
        if not have_close:
            hits = 0
            for p in list(base.rglob("*.c")) + list(base.rglob("*.h")):
                t = head(p)
                if "ksys_close(" in t:
                    p.write_text(t.replace("ksys_close(",
                                           "__close_fd(current->files, "))
                    hits += 1
            print("[+] ksys_close -> __close_fd(current->files,) in %d files" % hits)

        # 5. syscall_fn_t only exists from 4.17, and only for x86_64 upstream.
        sh = base / "hook/syscall_hook.h"
        if sh.is_file():
            t = head(sh)
            old = "typedef sys_call_ptr_t syscall_fn_t;"
            if old in t and "KERNEL_VERSION(4, 17, 0)" not in t:
                new = ("#include <linux/version.h>\n"
                       "#if defined(__x86_64__)\n"
                       "typedef sys_call_ptr_t syscall_fn_t;\n"
                       "#elif defined(CONFIG_ARM64) && "
                       "LINUX_VERSION_CODE < KERNEL_VERSION(4, 17, 0)\n"
                       "typedef unsigned long (*syscall_fn_t)(const struct pt_regs *);\n"
                       "#endif")
                sh.write_text(t.replace(old, new))
                print("[+] syscall_hook.h: arm64 syscall_fn_t typedef added")
            else:
                print("[=] syscall_hook.h: nothing to patch")

        # 6. MODULE_IMPORT_NS arrived in 5.x. The code is linked into the
        #    image, so the namespace tag is metadata and a no-op is correct.
        # The call site moved between releases (v4.2 core/init.c, v4.0 ksu.c),
        # so handle every file that uses it.
        guard = ("#ifndef MODULE_IMPORT_NS\n"
                 "#define MODULE_IMPORT_NS(name)\n"
                 "#endif\n")
        hits = 0
        for p in list(base.rglob("*.c")) + list(base.rglob("*.h")):
            t = head(p)
            if "MODULE_IMPORT_NS(" not in t or "#ifndef MODULE_IMPORT_NS" in t:
                continue
            # Prepend, not insert-before-first-use: the first use can sit
            # inside a version guard that this kernel does not compile, and
            # then the shim would never be defined for the branch in use.
            p.write_text(guard + t)
            hits += 1
        print("[+] MODULE_IMPORT_NS shim added to %d files" % hits)

        # 14. force_sig() lost its task_struct argument in 5.11; 4.14 still
        #     takes force_sig(sig, p).
        sig_h = kl / "sched/signal.h"
        if not sig_h.is_file():
            sys.exit("[!] %s not found" % sig_h)
        if re.search(r"force_sig\s*\(\s*int\s*,\s*struct\s+task_struct\s*\*", head(sig_h)):
            hits = 0
            for p in list(base.rglob("*.c")) + list(base.rglob("*.h")):
                t = head(p)
                t2, n2 = re.subn(r"force_sig\(([^,()]+)\)", r"force_sig(\1, current)", t)
                if n2:
                    p.write_text(t2)
                    hits += n2
            print("[+] force_sig -> force_sig(sig, current): %d sites" % hits)

        # 15. anon_inode_getfd_secure() is 5.x+. 4.14 has anon_inode_getfd()
        #     with four arguments and no trailing security context.
        an = kl / "anon_inodes.h"
        if not an.is_file():
            sys.exit("[!] %s not found" % an)
        if "anon_inode_getfd_secure" not in head(an):
            if "anon_inode_getfd" not in head(an):
                sys.exit("[!] no anon_inode_getfd in anon_inodes.h")
            hits = 0
            for p in list(base.rglob("*.c")) + list(base.rglob("*.h")):
                t = head(p)
                t2 = t.replace("#define getfd_secure anon_inode_getfd_secure",
                               "#define getfd_secure anon_inode_getfd")
                t2, n2 = re.subn(r"(getfd_secure\s*\([^;]*?),\s*NULL\s*\)", r"\1)", t2)
                if t2 != t:
                    if "#include <linux/anon_inodes.h>" not in t2:
                        t2 = "#include <linux/anon_inodes.h>\n" + t2
                    p.write_text(t2)
                    hits += 1
            print("[+] anon_inode_getfd_secure -> anon_inode_getfd in %d files" % hits)

        # 16. selinux_inode() does not exist in 4.14 (it arrived with the 5.x
        #     SELinux rework). It is only used to stamp ksu_file_sid on the
        #     anon inode; without a way to write the sid from outside the
        #     hooks file, let the inode keep the creator's own context.
        sh = kl.parent.parent / "security/selinux/hooks.h"
        has_selinux_inode = sh.is_file() and "selinux_inode" in head(sh)
        if not has_selinux_inode:
            hits = 0
            for p in list(base.rglob("*.c")) + list(base.rglob("*.h")):
                t = head(p)
                if re.search(r"\bselinux_inode\s*\(", t):
                    t = re.sub(r"\bselinux_inode\s*\(", "ksu_selinux_inode(", t)
                    t = ("#ifndef ksu_selinux_inode\n"
                         "#define ksu_selinux_inode(inode) NULL\n"
                         "#endif\n" + t)
                    p.write_text(t)
                    hits += 1
            print("[+] selinux_inode -> NULL shim in %d files (absent in 4.14)" % hits)

        # 17. __poll_t appeared after 4.14, which used plain unsigned int for
        #     the poll return type.
        tys = kl / "types.h"
        if not tys.is_file():
            sys.exit("[!] %s not found" % tys)
        if "__poll_t" not in head(tys):
            hits = 0
            for p in list(base.rglob("*.c")) + list(base.rglob("*.h")):
                t = head(p)
                if "__poll_t" in t:
                    p.write_text(t.replace("__poll_t", "unsigned int"))
                    hits += 1
            print("[+] __poll_t -> unsigned int in %d files" % hits)

        # 18. file_operations grew members this 4.14 tree has no slot for:
        #     iopoll (5.7), remap_file_range and fadvise (5.1),
        #     mmap_supported_flags (5.8). The wrapper installs proxies with
        #     "p->ops.<member> = ..." and dereferences "->f_op-><member>",
        #     so both the assignment and the proxy body have to go.
        fsh2 = kl / "fs.h"
        if not fsh2.is_file():
            sys.exit("[!] %s not found" % fsh2)
        ftxt = head(fsh2)
        try:
            a = ftxt.index("struct file_operations {")
            b = ftxt.index("\n};", a)
        except ValueError:
            sys.exit("[!] could not locate struct file_operations")
        body = ftxt[a:b]
        have = set()
        for line in body.splitlines():
            line = line.split("//")[0]
            mm = re.search(r"\(\s*\*\s*(\w+)\s*\)\s*\(", line)
            if mm:
                have.add(mm.group(1))
                continue
            if line.strip().endswith(";"):
                tail = re.findall(r"(\w+)\s*;$", line.strip())
                if tail:
                    have.add(tail[-1])
        # Sanity check: a parse slip here would silently strip live members
        # such as .owner, so refuse to continue unless the basics came back.
        for need in ("owner", "read", "write", "open", "release", "poll", "llseek"):
            if need not in have:
                sys.exit("[!] file_operations parse looks wrong (no %r); aborting" % need)

        def kill_fns(txt, member):
            """Wrap whole function definitions that dereference ->member.

            Matched by top-level block rather than by "static ... {" on one
            line: several proxies are declared "void ..." or have the opening
            brace on a continuation line, and both spellings slipped past a
            single-line signature match.
            """
            lines = txt.split("\n")
            spans = []
            i = 0
            n = len(lines)
            while i < n:
                ln = lines[i]
                head_ok = (ln and not ln[0].isspace() and not ln.startswith("#")
                           and re.match(r"^(static|const|struct|int|void|ssize_t|"
                                        r"loff_t|unsigned|bool|long|char|__poll_t)\b", ln)
                           and "(" in ln and not ln.rstrip().endswith(";"))
                if not head_ok:
                    i += 1
                    continue
                j = i
                while j < n and lines[j] != "}":
                    j += 1
                if j >= n:
                    break
                if re.search(r"->\s*%s\b" % re.escape(member), "\n".join(lines[i:j + 1])):
                    spans.append((i, j))
                i = j + 1
            for (i, j) in reversed(spans):
                lines[i:j + 1] = ["#if 0"] + lines[i:j + 1] + ["#endif"]
            return "\n".join(lines)

        absent = set()
        for p in list(base.rglob("*.c")) + list(base.rglob("*.h")):
            t = head(p)
            # file_wrapper.c never spells out "file_operations": it only
            # writes p->ops.<member> against an embedded fops, so match the
            # access patterns rather than the type name.
            absent |= set(re.findall(r"->\s*ops\s*\.\s*(\w+)\s*=", t))
            absent |= set(re.findall(r"->\s*f_op\s*->\s*(\w+)", t))
        absent = sorted(m for m in absent if m not in have)
        hits = 0
        for member in absent:
            for p in list(base.rglob("*.c")) + list(base.rglob("*.h")):
                t = head(p)
                if ("->ops." not in t) and ("->f_op->" not in t):
                    continue
                if not re.search(r"(->\s*ops\s*\.\s*%s\s*=|->\s*f_op\s*->\s*%s\b)"
                                 % (re.escape(member), re.escape(member)), t):
                    continue
                t = re.sub(r"^[^\n]*->\s*ops\s*\.\s*%s\s*=[^\n]*\n" % re.escape(member),
                           "", t, flags=re.M)
                t = kill_fns(t, member)
                p.write_text(t)
                hits += 1
        if absent:
            print("[+] fops members absent in 4.14, dropped: %s" % ", ".join(absent))
            print("[+]   proxies neutralised in %d files" % hits)
        else:
            print("[=] every referenced file_operations member exists here")

        # 20. SukiSU's sepolicy engine drives the SELinux policydb directly, and
        #     four of its functions assume the 5.x rhashtable filename transitions
        #     plus plain array policydb fields. This tree still uses the pre-4.16
        #     hashtab and struct flex_array, so rewrite those against the layout
        #     this kernel actually uses, mirroring security/selinux/ss/policydb.c.
        sep = base / "selinux/sepolicy.c"
        if not sep.is_file():
            sys.exit("[!] %s not found" % sep)
        pdbh = ksrc / "security/selinux/ss/policydb.h"
        if not pdbh.is_file():
            sys.exit("[!] %s not found" % pdbh)
        pdb = head(pdbh)
        legacy = ("struct flex_array" in pdb) and \
                 re.search(r"struct\s+hashtab\s*\*\s*filename_trans\s*;", pdb) is not None
        if not legacy:
            print("[=] policydb is not the legacy hashtab/flex_array layout, left alone")
        else:
            def find_defn(txt, name):
                """Definition of name, skipping its forward declaration."""
                lines = txt.split("\n")
                pat = re.compile(r"^(?:static\s+)?[A-Za-z_][\w \*]*\b%s\s*\(" % re.escape(name))
                i = 0
                while i < len(lines):
                    if pat.match(lines[i]):
                        j = i
                        sig = []
                        while j < len(lines) and j - i <= 12:
                            sig.append(lines[j])
                            st = lines[j].strip()
                            if st.endswith("{") and not st.startswith("#"):
                                break
                            if st.endswith(";") and not st.startswith("#"):
                                break
                            j += 1
                        if " ".join(sig).rstrip().endswith(";"):
                            i = j + 1
                            continue
                        k = j
                        while k < len(lines) and lines[k] != "}":
                            k += 1
                        if k < len(lines):
                            return i, k
                    i += 1
                return None

            def swap(txt, name, body):
                r = find_defn(txt, name)
                if not r:
                    sys.exit("[!] definition of %s not found" % name)
                lines = txt.split("\n")
                lines[r[0]:r[1] + 1] = body.split("\n")
                return "\n".join(lines)

            C_HASH = """static u32 filenametr_hash(struct hashtab *h, const void *k)
        {
            const struct filename_trans *ft = k;
            unsigned long hash;
            unsigned int byte_num;
            unsigned char focus;

            hash = ft->stype ^ ft->ttype ^ ft->tclass;

            byte_num = 0;
            while ((focus = ft->name[byte_num++]))
                hash = partial_name_hash(focus, hash);
            return hash & (h->size - 1);
        }"""

            C_CMP = """static int filenametr_cmp(struct hashtab *h, const void *k1, const void *k2)
        {
            const struct filename_trans *ft1 = k1;
            const struct filename_trans *ft2 = k2;
            int v;

            v = ft1->stype - ft2->stype;
            if (v)
                return v;

            v = ft1->ttype - ft2->ttype;
            if (v)
                return v;

            v = ft1->tclass - ft2->tclass;
            if (v)
                return v;

            return strcmp(ft1->name, ft2->name);
        }"""

            C_FTRANS = """static bool add_filename_trans(struct policydb *db, const char *s,
                       const char *t, const char *c, const char *d,
                       const char *o)
        {
            struct type_datum *src, *tgt, *def;
            struct class_datum *cls;
            struct filename_trans *ft;
            struct filename_trans_datum *otype;
            int rc;

            src = symtab_search(&db->p_types, s);
            if (src == NULL) {
                pr_warn("source type %s does not exist\\n", s);
                return false;
            }
            tgt = symtab_search(&db->p_types, t);
            if (tgt == NULL) {
                pr_warn("target type %s does not exist\\n", t);
                return false;
            }
            cls = symtab_search(&db->p_classes, c);
            if (cls == NULL) {
                pr_warn("class %s does not exist\\n", c);
                return false;
            }
            def = symtab_search(&db->p_types, d);
            if (def == NULL) {
                pr_warn("default type %s does not exist\\n", d);
                return false;
            }

            /* The legacy table keys on the source type as well, so there is one
               entry per (stype, ttype, tclass, name) rather than a chain of
               source-type bits hanging off a shared key. */
            ft = kmalloc(sizeof(*ft), GFP_ATOMIC);
            if (!ft) {
                pr_err("add_filename_trans: alloc key failed\\n");
                return false;
            }
            ft->stype = src->value;
            ft->ttype = tgt->value;
            ft->tclass = cls->value;
            ft->name = kstrdup(o, GFP_ATOMIC);
            if (!ft->name) {
                pr_err("add_filename_trans: alloc name failed\\n");
                kfree(ft);
                return false;
            }

            otype = kmalloc(sizeof(*otype), GFP_ATOMIC);
            if (!otype) {
                pr_err("add_filename_trans: alloc datum failed\\n");
                kfree(ft->name);
                kfree(ft);
                return false;
            }
            otype->otype = def->value;

            if (ebitmap_set_bit(&db->filename_trans_ttypes, ft->ttype, 1)) {
                pr_err("add_filename_trans: set ttypes failed\\n");
                kfree(otype);
                kfree(ft->name);
                kfree(ft);
                return false;
            }

            rc = hashtab_insert(db->filename_trans, ft, otype);
            if (rc) {
                /* -EEXIST means the rule is already present, which is the state the
                   caller asked for. The kernel deliberately swallows this one too:
                   propagating it would fail policy reload and the boot. */
                kfree(otype);
                kfree(ft->name);
                kfree(ft);
                if (rc != -EEXIST) {
                    pr_err("add_filename_trans: hashtab insert failed\\n");
                    return false;
                }
            }
            return true;
        }"""

            C_HELPER = """static bool ksu_flex_ensure(struct flex_array **fa, size_t elemsz, unsigned int nr)
        {
            if (!*fa) {
                *fa = flex_array_alloc(elemsz, nr, GFP_ATOMIC | __GFP_ZERO);
                return *fa != NULL;
            }
            return flex_array_prealloc(*fa, 0, nr, GFP_ATOMIC | __GFP_ZERO) == 0;
        }"""

            C_ADDTYPE = """static bool add_type(struct policydb *db, const char *type_name, bool attr)
        {
            struct type_datum *type = symtab_search(&db->p_types, type_name);
            if (type) {
                pr_warn("Type %s already exists\\n", type_name);
                return true;
            }

            u32 value = ++db->p_types.nprim;
            type = (struct type_datum *)kzalloc(sizeof(struct type_datum), GFP_ATOMIC);
            if (!type) {
                pr_err("add_type: alloc type_datum failed.\\n");
                return false;
            }

            type->primary = 1;
            type->value = value;
            type->attribute = attr;

            char *key = kstrdup(type_name, GFP_ATOMIC);
            if (!key) {
                pr_err("add_type: alloc key failed.\\n");
                return false;
            }

            if (symtab_insert(&db->p_types, key, type)) {
                pr_err("add_type: insert symtab failed.\\n");
                return false;
            }

            /* These three are struct flex_array in this tree, so they have to grow
               through flex_array_alloc/prealloc rather than plain realloc. */
            if (!ksu_flex_ensure(&db->type_attr_map_array, sizeof(struct ebitmap), value) ||
                !ksu_flex_ensure(&db->type_val_to_struct_array, sizeof(struct type_datum *), value) ||
                !ksu_flex_ensure(&db->sym_val_to_name[SYM_TYPES], sizeof(char *), value)) {
                pr_err("add_type: grow policydb arrays failed\\n");
                return false;
            }

            ebitmap_init(flex_array_get_ptr(db->type_attr_map_array, value - 1));
            ebitmap_set_bit(flex_array_get_ptr(db->type_attr_map_array, value - 1), value - 1, 1);
            flex_array_put_ptr(db->type_val_to_struct_array, value - 1, type, GFP_ATOMIC);
            flex_array_put_ptr(db->sym_val_to_name[SYM_TYPES], value - 1, key, GFP_ATOMIC);

            int i;
            for (i = 0; i < db->p_roles.nprim; ++i) {
                ebitmap_set_bit(&db->role_val_to_struct[i]->types, value - 1, 1);
            }

            return true;
        }"""

            t = head(sep)
            # The rhashtable key-params global is left dangling by the rewrite above
            # and names a type this kernel does not have, so drop it.
            t = head(sep)
            if "flex_array.h" not in t:
                lines = t.split("\n")
                last_inc = max(i for i, ln in enumerate(lines) if ln.startswith("#include"))
                lines.insert(last_inc + 1, "#include <linux/flex_array.h>")
                t = "\n".join(lines)
            t = swap(t, "filenametr_hash", C_HASH)
            t = swap(t, "filenametr_cmp", C_CMP)
            t = swap(t, "add_filename_trans", C_FTRANS)
            t = swap(t, "add_type", C_HELPER + "\n\n" + C_ADDTYPE)
            # Every remaining direct index of type_attr_map_array has to go
            # through flex_array_get_ptr too.
            t = re.sub(r"&db->type_attr_map_array\[([^\]]+)\]",
                       r"flex_array_get_ptr(db->type_attr_map_array, \1)", t)
            t = re.sub(r"db->type_attr_map_array\[([^\]]+)\]",
                       r"flex_array_get_ptr(db->type_attr_map_array, \1)", t)
            sep.write_text(t)
                        # 20b. rules.c: selinux_state.policy changed to policydb under ss
                        rc = base / "selinux/rules.c"
                        if rc.is_file():
                            rt = head(rc)
                            rt, n1 = re.subn(r"selinux_state\.policy", "selinux_state.ss->policydb", rt)
                            rt, n2 = re.subn(r"selinux_status_update_policyload\(&selinux_state,",
                                             "selinux_status_update_policyload(&selinux_state.ss->policydb,",
                                             rt)
                            rc.write_text(rt)
                            if n1 or n2:
                                print("[+] rules.c: patched selinux_state access (%d,%d)" % (n1,n2))
            print("[+] sepolicy ported to hashtab/flex_array: 4 functions")

        # 19. SukiSU ships kernel/selinux/selinux.h, which shadows the
        #     kernel's internal header of the same name, so selinux_cred()
        #     arrives undeclared -- and this tree does not define it at all.
        #     Its SELinux hooks keep the per-cred blob in cred->security,
        #     which is exactly what selinux_cred() would hand back.
        slh = base / "selinux/selinux.h"
        slc = base / "selinux/selinux.c"
        if not (slh.is_file() and slc.is_file()):
            sys.exit("[!] %s / %s not found" % (slh, slc))
        if "selinux_cred" not in head(slh):
            objsec = ksrc / "security/selinux/include/objsec.h"
            credh = kl / "cred.h"
            if not (objsec.is_file() and credh.is_file()):
                sys.exit("[!] %s or %s not found" % (objsec, credh))
            if "task_security_struct" not in head(objsec):
                sys.exit("[!] task_security_struct missing from %s" % objsec)
            if not re.search(r"void\s*\*\s*security\s*;", head(credh)):
                sys.exit("[!] struct cred has no ->security member")
            t = head(slc)
            t, n = re.subn(r"\bselinux_cred\s*\(\s*cred\s*\)",
                           "ksu_cred_tsec(cred)", t)
            helper = ("\nstatic inline const struct task_security_struct *\n"
                      "ksu_cred_tsec(const struct cred *cred)\n{\n"
                      "\treturn (const struct task_security_struct *)cred->security;\n}\n")
            lines = t.split("\n")
            last_inc = max(i for i, ln in enumerate(lines) if ln.startswith("#include"))
            lines.insert(last_inc + 1, helper)
            slc.write_text("\n".join(lines))
            print("[+] selinux_cred -> cred->security, %d call sites" % n)

        # 13. Symbols that live in a different header on 4.14. Add the
        #     header that this tree actually declares them in.
        for sym, hdr in [("MNT_DETACH", "linux/fs.h"),
                         ("get_random_bytes", "linux/random.h"),
                         ("get_task_struct", "linux/sched/task.h")]:
            kdef = kl / hdr.replace("linux/", "", 1)
            if not kdef.is_file():
                continue
            if sym not in head(kdef):
                sys.exit("[!] %s not declared in %s" % (sym, kdef))
            hits = 0
            for p in list(base.rglob("*.c")) + list(base.rglob("*.h")):
                t = head(p)
                if sym in t and ("#include <%s>" % hdr) not in t:
                    p.write_text("#include <%s>\n" % hdr + t)
                    hits += 1
            print("[+] %s: added %s to %d files" % (sym, hdr, hits))

        # 12. pkg_observer.c is written against the 5.x fsnotify API
        #     (handle_inode_event, fsnotify_add_inode_mark), which 4.14 does
        #     not have. Its ksu_observer_init()/exit() are never called from
        #     anywhere, so only its Makefile line keeps it in the build:
        #     drop that line rather than port a whole subsystem.
        fsh = kl / "fsnotify.h"
        mk = base / "Makefile"
        if fsh.is_file() and mk.is_file():
            fst = head(fsh)
            if "handle_inode_event" not in fst and "pkg_observer.o" in head(mk):
                mk.write_text(head(mk).replace("kernelsu-objs += pkg_observer.o\n", ""))
                print("[+] pkg_observer.o dropped (needs 5.x fsnotify API)")

        # 11. clone3 (and its __NR_clone3) arrived in 5.3. 4.14 only has
        #     clone, so the "same shape as clone" check must use clone alone.
        hits = 0
        for p in list(base.rglob("*.c")) + list(base.rglob("*.h")):
            t = head(p)
            if "__NR_clone3" in t:
                t = t.replace("case __NR_clone3:", "")
                t = t.replace("id == __NR_clone3", "0")
                p.write_text(t)
                hits += 1
        print("[+] __NR_clone3 neutralised in %d files" % hits)

        # 10. struct seccomp gained an atomic filter_count in 5.9. 4.14 only
        #     has mode and filter, so drop the line that touches it.
        sc2 = kl / "seccomp.h"
        if not sc2.is_file():
            sys.exit("[!] %s not found" % sc2)
        sct = head(sc2)
        if "filter_count" not in sct:
            hits = 0
            for p in list(base.rglob("*.c")) + list(base.rglob("*.h")):
                t = head(p)
                if "seccomp.filter_count" in t:
                    keep = [l for l in t.splitlines(True) if "seccomp.filter_count" not in l]
                    p.write_text("".join(keep))
                    hits += 1
            print("[+] seccomp.filter_count lines dropped from %d files" % hits)

        # 8. task_work_add() took a bool in 4.14; the TWA_* enum that
        #    SukiSU passes arrived in 5.15.
        tw = kl / "task_work.h"
        if not tw.is_file():
            sys.exit("[!] %s not found" % tw)
        twt = head(tw)
        if "TWA_RESUME" not in twt:
            if not re.search(r"task_work_add\s*\([^;]*\bbool\b", twt):
                sys.exit("[!] unrecognised task_work_add signature")
            hits = 0
            for p in list(base.rglob("*.c")) + list(base.rglob("*.h")):
                t = head(p)
                if "TWA_RESUME" in t:
                    p.write_text(t.replace("TWA_RESUME", "true"))
                    hits += 1
            print("[+] TWA_RESUME -> true in %d files" % hits)

        # 9. put_task_struct() is declared in sched/task.h since 4.11 and
        #    some SukiSU files use it without including that header.
        hits = 0
        for p in list(base.rglob("*.c")) + list(base.rglob("*.h")):
            t = head(p)
            if re.search(r"\bput_task_struct\s*\(", t) and \
                    "linux/sched/task.h" not in t:
                p.write_text("#include <linux/sched/task.h>\n" + t)
                hits += 1
        print("[+] sched/task.h added to %d files using put_task_struct" % hits)

        # 7. linux/pgtable.h was split out of pagemap.h in 5.18.
        dst = pathlib.Path("include/linux/pgtable.h")
        if dst.exists():
            print("[=] include/linux/pgtable.h already present")
        else:
            dst.parent.mkdir(parents=True, exist_ok=True)
            dst.write_text("#ifndef _KSU_COMPAT_PGTABLE\n"
                           "#define _KSU_COMPAT_PGTABLE\n"
                           "#include <linux/pagemap.h>\n"
                           "#endif\n")
            print("[+] created include/linux/pgtable.h -> linux/pagemap.h")
        PYEOF

    - name: Setup Configuration for Kernel
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
        if [ ${{ env.ENABLE_KERNELSU }} = true ]; then
            if [ ${{ env.KSU_HOOKS_PATCH }} = true ]; then
                git apply $GITHUB_WORKSPACE/patches/KSU_HOOKS_PATCH.patch
                if grep -q "CONFIG_KSU" arch/${{ env.KERNEL_ARCH }}/configs/${{ env.KERNEL_CONFIG }}; then
                    sed -i 's/# CONFIG_KSU is not set/CONFIG_KSU=y/g' arch/${{ env.KERNEL_ARCH }}/configs/${{ env.KERNEL_CONFIG }}
                    sed -i 's/CONFIG_KSU=n/CONFIG_KSU=y/g' arch/${{ env.KERNEL_ARCH }}/configs/${{ env.KERNEL_CONFIG }}
                else
                    echo "CONFIG_KSU=y" >> arch/${{ env.KERNEL_ARCH }}/configs/${{ env.KERNEL_CONFIG }}
                fi
            fi
            if [ ${{ env.ADD_KPROBES_CONFIG }} = true -a ${{ env.KSU_HOOKS_PATCH }} != true ]; then
                echo "CONFIG_MODULES=y" >> arch/${{ env.KERNEL_ARCH }}/configs/${{ env.KERNEL_CONFIG }}
                echo "CONFIG_KPROBES=y" >> arch/${{ env.KERNEL_ARCH }}/configs/${{ env.KERNEL_CONFIG }}
                echo "CONFIG_HAVE_KPROBES=y" >> arch/${{ env.KERNEL_ARCH }}/configs/${{ env.KERNEL_CONFIG }}
                echo "CONFIG_KPROBE_EVENTS=y" >> arch/${{ env.KERNEL_ARCH }}/configs/${{ env.KERNEL_CONFIG }}
            fi
          for config in CONFIG_KSU=y \
                        CONFIG_KPM=y \
                        CONFIG_KPROBES=y \
                        CONFIG_HAVE_KPROBES=y \
                        CONFIG_KPROBE_EVENTS=y \
                        CONFIG_KALLSYMS=y \
                        CONFIG_KALLSYMS_ALL=y \
                        CONFIG_SECURITY_SELINUX_DEVELOP=y
                     
        do
        echo "$config" >> arch/${{ env.KERNEL_ARCH }}/configs/${{ env.KERNEL_CONFIG }}
        done
        fi
        if [ ${{ env.ADD_OVERLAYFS_CONFIG }} = true ]; then
            echo "CONFIG_OVERLAY_FS=y" >> arch/${{ env.KERNEL_ARCH }}/configs/${{ env.KERNEL_CONFIG }}
            echo "CONFIG_OVERLAY_FS_REDIRECT_DIR=y" >> arch/${{ env.KERNEL_ARCH }}/configs/${{ env.KERNEL_CONFIG }}
            echo "CONFIG_OVERLAY_FS_INDEX=y" >> arch/${{ env.KERNEL_ARCH }}/configs/${{ env.KERNEL_CONFIG }}
        fi
        if [ ${{ env.ADD_APATCH_SUPPORT }} = true ]; then
                sed -i 's/# CONFIG_DEBUG_KERNEL is not set/CONFIG_DEBUG_KERNEL=y/g' arch/${{ env.KERNEL_ARCH }}/configs/${{ env.KERNEL_CONFIG }}
                sed -i 's/CONFIG_DEBUG_KERNEL=n/CONFIG_DEBUG_KERNEL=y/g' arch/${{ env.KERNEL_ARCH }}/configs/${{ env.KERNEL_CONFIG }}
                echo "CONFIG_DEBUG_KERNEL=y" >> arch/${{ env.KERNEL_ARCH }}/configs/${{ env.KERNEL_CONFIG }}
                sed -i 's/# CONFIG_KALLSYMS is not set/CONFIG_KALLSYMS=y/g' arch/${{ env.KERNEL_ARCH }}/configs/${{ env.KERNEL_CONFIG }}
                sed -i 's/CONFIG_KALLSYMS=n/CONFIG_KALLSYMS=y/g' arch/${{ env.KERNEL_ARCH }}/configs/${{ env.KERNEL_CONFIG }}
                echo "CONFIG_KALLSYMS=y" >> arch/${{ env.KERNEL_ARCH }}/configs/${{ env.KERNEL_CONFIG }}
                sed -i 's/# CONFIG_KALLSYMS_ALL is not set/CONFIG_KALLSYMS_ALL=y/g' arch/${{ env.KERNEL_ARCH }}/configs/${{ env.KERNEL_CONFIG }}
                sed -i 's/CONFIG_KALLSYMS_ALL=n/CONFIG_KALLSYMS_ALL=y/g' arch/${{ env.KERNEL_ARCH }}/configs/${{ env.KERNEL_CONFIG }}
                echo "CONFIG_KALLSYMS_ALL=y" >> arch/${{ env.KERNEL_ARCH }}/configs/${{ env.KERNEL_CONFIG }}
                sed -i 's/# CONFIG_KALLSYMS_BASE_RELATIVE is not set/CONFIG_KALLSYMS_BASE_RELATIVE=y/g' arch/${{ env.KERNEL_ARCH }}/configs/${{ env.KERNEL_CONFIG }}
                sed -i 's/CONFIG_KALLSYMS_BASE_RELATIVE=n/CONFIG_KALLSYMS_BASE_RELATIVE=y/g' arch/${{ env.KERNEL_ARCH }}/configs/${{ env.KERNEL_CONFIG }}
                echo "CONFIG_KALLSYMS_BASE_RELATIVE=y" >> arch/${{ env.KERNEL_ARCH }}/configs/${{ env.KERNEL_CONFIG }}
                if [ ${{ env.FIX_APATCH_OPENELA }} = true ]; then
                    git apply $GITHUB_WORKSPACE/patches/FIX_APATCH_OPENELA.patch || {
                    git apply $GITHUB_WORKSPACE/patches/REVERT_ADD_GET_CRED_RCU.patch
                    git apply $GITHUB_WORKSPACE/patches/FIX_APATCH_OPENELA.patch
                    }
                fi
        fi
        if [ ${{ env.DISABLE_LTO }} = true ]; then
            sed -i 's/CONFIG_LTO=y/CONFIG_LTO=n/' arch/${{ env.KERNEL_ARCH }}/configs/${{ env.KERNEL_CONFIG }}
            sed -i 's/CONFIG_LTO_CLANG=y/CONFIG_LTO_CLANG=n/' arch/${{ env.KERNEL_ARCH }}/configs/${{ env.KERNEL_CONFIG }}
            sed -i 's/CONFIG_THINLTO=y/CONFIG_THINLTO=n/' arch/${{ env.KERNEL_ARCH }}/configs/${{ env.KERNEL_CONFIG }}
            echo "CONFIG_LTO_NONE=y" >> arch/${{ env.KERNEL_ARCH }}/configs/${{ env.KERNEL_CONFIG }}
        fi
        if [ ${{ env.DISABLE_CC_WERROR }} = true ]; then
            echo "CONFIG_CC_WERROR=n" >> arch/${{ env.KERNEL_ARCH }}/configs/${{ env.KERNEL_CONFIG }}
        fi
        if [ ${{ env.OLD_ANDROID_SUPPORT }} = true ]; then
            git apply $GITHUB_WORKSPACE/patches/OLD_ANDROID_SUPPORT.patch || {
            echo "[!] patch context mismatch, applying sdcardfs change directly"
            sed -i 's/^\tdefault n$/\tdefault y/' fs/sdcardfs/Kconfig
            }
            grep -q "default n" fs/sdcardfs/Kconfig && echo "[!] WARNING: SDCARD_FS still defaults to n"
            if grep -q "CONFIG_MMC_CRYPTO_LEGACY" arch/${{ env.KERNEL_ARCH }}/configs/${{ env.KERNEL_CONFIG }}; then
                sed -i 's/# CONFIG_MMC_CRYPTO_LEGACY is not set/CONFIG_MMC_CRYPTO_LEGACY=y/g' arch/${{ env.KERNEL_ARCH }}/configs/${{ env.KERNEL_CONFIG }}
                sed -i 's/CONFIG_MMC_CRYPTO_LEGACY=n/CONFIG_MMC_CRYPTO_LEGACY=y/g' arch/${{ env.KERNEL_ARCH }}/configs/${{ env.KERNEL_CONFIG }}
            else
                echo "CONFIG_MMC_CRYPTO_LEGACY=y" >> arch/${{ env.KERNEL_ARCH }}/configs/${{ env.KERNEL_CONFIG }}
            fi
        fi
        if [ ${{ env.FIX_WIFI_SPEED }} = true ]; then
            rm -rf drivers/misc/mediatek/connectivity
            cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel/drivers/misc/mediatek
            git clone https://github.com/Jbub5/connectivity.git --depth=1
            cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
        fi

    - name: Setup ccache
      if: env.ENABLE_CCACHE == 'true'
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: build-kernel-${{ env.DEVICE }}${{ env.LOCALVERSION }}${{ env.UPLOADNAME }}
        max-size: 2G

    - name: Build kernel
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
        if [ ${{ env.USE_CUSTOM_CLANG }} = true ]; then
            export PATH=$GITHUB_WORKSPACE/kernel_workspace/clang/bin:$PATH
        fi
        if [ ${{ env.USE_CUSTOM_GCC }} = true ]; then
            if [ ${{ env.USE_CUSTOM_GCC_64 }} = true ]; then
                export PATH=$GITHUB_WORKSPACE/kernel_workspace/gcc-64/bin:$PATH
            fi
            if [ ${{ env.USE_CUSTOM_GCC_32 }} = true ]; then
                export PATH=$GITHUB_WORKSPACE/kernel_workspace/gcc-32/bin:$PATH
            fi
        fi
        export KBUILD_BUILD_HOST=Github-Action
        export KBUILD_BUILD_USER=$(echo ${{ github.actor }} | tr A-Z a-z)
        if [ -n ${{ env.KSU_EXPECTED_SIZE }} ] && [ -n ${{ env.KSU_EXPECTED_HASH }} ]; then
          export KSU_EXPECTED_SIZE=${{ env.KSU_EXPECTED_SIZE }}
          export KSU_EXPECTED_HASH=${{ env.KSU_EXPECTED_HASH }}
        fi
        CC_CMD=clang
        if [ ${{ env.ENABLE_CCACHE }} = true ]; then
            CC_CMD="ccache clang"
        fi
        make -j$(nproc --all) CC="$CC_CMD" O=out ARCH=${{ env.KERNEL_ARCH }} ${{ env.EXTRA_CMDS }} ${{ env.KERNEL_CONFIG }}
        make -j$(nproc --all) CC="$CC_CMD" O=out ARCH=${{ env.KERNEL_ARCH }} ${{ env.EXTRA_CMDS }}

    - name: Check a kernel output files
      run: |
       cd $GITHUB_WORKSPACE/kernel_workspace
       if [ -f android-kernel/out/arch/${{ env.KERNEL_ARCH }}/boot/${{ env.KERNEL_IMAGE_NAME }} ]; then
           echo "CHECK_FILE_IS_OK=true" >> $GITHUB_ENV
       else
           echo "Kernel output file is empty"
           exit 1
       fi
       if [ ${{ env.NEED_DTBO }} = true ]; then
           if [ -f android-kernel/out/arch/${{ env.KERNEL_ARCH }}/boot/dtbo.img ]; then
               echo "CHECK_DTBO_IS_OK=true" >> $GITHUB_ENV
           else
               echo "DTBO image is empty"
               exit 1
           fi
       fi

    - name: Make Anykernel3
      if: env.CHECK_FILE_IS_OK == 'true' && env.USE_CUSTOM_ANYKERNEL3 != 'true'
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        git clone https://github.com/osm0sis/AnyKernel3 --depth=1 AnyKernel3
        sed -i 's/do.devicecheck=1/do.devicecheck=0/g' AnyKernel3/anykernel.sh
        sed -i 's!BLOCK=/dev/block/platform/omap/omap_hsmmc.0/by-name/boot;!BLOCK=auto;!g' AnyKernel3/anykernel.sh
        sed -i 's/IS_SLOT_DEVICE=0;/is_slot_device=auto;/g' AnyKernel3/anykernel.sh
        cp android-kernel/out/arch/${{ env.KERNEL_ARCH }}/boot/${{ env.KERNEL_IMAGE_NAME }} AnyKernel3/
        if [ ${{ env.CHECK_DTBO_IS_OK }} = true ]; then
            cp android-kernel/out/arch/${{ env.KERNEL_ARCH }}/boot/dtbo.img AnyKernel3/
        fi
        rm -rf AnyKernel3/.git* AnyKernel3/README.md

    - name: Make Custom-Anykernel3
      if: env.CHECK_FILE_IS_OK == 'true' && env.USE_CUSTOM_ANYKERNEL3 == 'true'
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        if [[ ${{ env.CUSTOM_ANYKERNEL3_SOURCE }} == *'.tar.gz' ]]; then
            wget -nv -O AnyKernel3.tar.gz ${{ env.CUSTOM_ANYKERNEL3_SOURCE }}
            mkdir AnyKernel3
            tar -C AnyKernel3/ -zxvf AnyKernel3.tar.gz
        elif [[ ${{ env.CUSTOM_ANYKERNEL3_SOURCE }} == *'.tar.xz' ]]; then
            wget -nv -O AnyKernel3.tar.xz ${{ env.CUSTOM_ANYKERNEL3_SOURCE }}
            mkdir AnyKernel3
            tar -C AnyKernel3/ -Jxvf AnyKernel3.tar.xz
        elif [[ ${{ env.CUSTOM_ANYKERNEL3_SOURCE }} == *'.git' ]]; then
            git clone ${{ env.CUSTOM_ANYKERNEL3_SOURCE }} -b ${{ env.CUSTOM_ANYKERNEL3_BRANCH }} --depth=1 AnyKernel3
        else
            wget -nv -O AnyKernel3.zip ${{ env.CUSTOM_ANYKERNEL3_SOURCE }}
            mkdir AnyKernel3
            unzip AnyKernel3.zip -d AnyKernel3/
        fi
        cp android-kernel/out/arch/${{ env.KERNEL_ARCH }}/boot/${{ env.KERNEL_IMAGE_NAME }} AnyKernel3/
        if [ ${{ env.CHECK_DTBO_IS_OK }} = true ]; then
            cp android-kernel/out/arch/${{ env.KERNEL_ARCH }}/boot/dtbo.img AnyKernel3/
        fi
        rm -rf AnyKernel3/.git* AnyKernel3/README.md

    - name: Make boot image
      if: env.HAVE_SOURCE_BOOT_IMAGE == 'true' && env.CHECK_FILE_IS_OK == 'true'
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        tools/unpack_bootimg.py --boot_img boot-source.img
        cp android-kernel/out/arch/${{ env.KERNEL_ARCH }}/boot/${{ env.KERNEL_IMAGE_NAME }} out/kernel
        tools/mkbootimg.py ${{ env.FORMAT_MKBOOTING }} -o boot.img
        if [ -f boot.img ]; then
            echo "MAKE_BOOT_IMAGE_IS_OK=true" >> $GITHUB_ENV
        else
            echo "Boot image is empty"
            exit 1
        fi

    - name: Zip AnyKernel3
      if: env.CHECK_FILE_IS_OK == 'true'
      run: |
        cd kernel_workspace/AnyKernel3
        zip -r AnyKernel3.zip *
        mv AnyKernel3.zip ..
        #zip -r AnyKernel3.zip . -i AnyKernel3/*

    - name: Rename Artifacts for Release
      if: env.CHECK_FILE_IS_OK == 'true'
      run: |
       cd kernel_workspace
       mv AnyKernel3.zip AnyKernel3${{ env.LOCALVERSION }}${{ env.UPLOADNAME }}-${{ env.DEVICE }}-${{ env.BUILD_TIME }}.zip
       mv android-kernel/out/arch/${{ env.KERNEL_ARCH }}/boot/${{ env.KERNEL_IMAGE_NAME }} ${{ env.KERNEL_IMAGE_NAME }}${{ env.LOCALVERSION }}${{ env.UPLOADNAME }}-${{ env.DEVICE }}-${{ env.BUILD_TIME }}

    - name: Create Release and Upload Assets
      uses: softprops/action-gh-release@v2
      with:
       tag_name: build-${{ env.BUILD_TIME }}
       name: Kernel Build ${{ env.BUILD_TIME }}
       draft: false
       prerelease: false
       files: |
        kernel_workspace/AnyKernel3${{ env.LOCALVERSION }}${{ env.UPLOADNAME }}-${{ env.DEVICE }}-${{ env.BUILD_TIME }}.zip
        kernel_workspace/${{ env.KERNEL_IMAGE_NAME }}${{ env.LOCALVERSION }}${{ env.UPLOADNAME }}-${{ env.DEVICE }}-${{ env.BUILD_TIME }}
       generate_release_notes: true
      env:
       GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    
    - name: Upload DTBO Image to Release
      if: env.CHECK_DTBO_IS_OK == 'true'
      uses: actions/upload-release-asset@v1
      env:
       GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
       upload_url: ${{ steps.create_release.outputs.upload_url }}
       asset_path: kernel_workspace/android-kernel/out/arch/${{ env.KERNEL_ARCH }}/boot/dtbo.img
       asset_name: dtbo-${{ env.DEVICE }}-${{ env.BUILD_TIME }}.img
       asset_content_type: application/octet-stream
    
    
    - name: Upload Boot Image to Release
      if: env.MAKE_BOOT_IMAGE_IS_OK == 'true'
      uses: actions/upload-release-asset@v1
      env:
       GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
       upload_url: ${{ steps.create_release.outputs.upload_url }}
       asset_path: kernel_workspace/boot.img
       asset_name: boot${{ env.LOCALVERSION }}${{ env.UPLOADNAME }}-{{ env.DEVICE }}-${{ env.BUILD_TIME }}.img
       asset_content_type: application/octet-stream
